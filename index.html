<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Repeater Path Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const map = L.map("map").setView([30.438, -84.280], 10);

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { attribution: "&copy; Esri" }).addTo(map);

    fetch("data.geojson")
  .then(response => response.json())
  .then(data => {

    L.geoJSON(data, {

      pointToLayer: function(feature, latlng) {

    // Repeaters
    if (feature.properties.type === "Repeater") {

if (feature.properties.band === "VHF") {

    // Slight offset for colocated repeaters
    const vhfLatLng = L.latLng(
        latlng.lat + 0.0025,
        latlng.lng - 0.0025
    );

    return L.circleMarker(vhfLatLng, {
        radius: 9,
        color: "#0000ff",
        fillColor: "#0000ff",
        fillOpacity: 1,
        opacity: 1,
        weight: 3
    });
}

 if (feature.properties.band === "UHF") {

    // Slight offset for colocated repeaters
    const uhfLatLng = L.latLng(
        latlng.lat - 0.0025,
        latlng.lng + 0.0025
    );

    return L.circleMarker(uhfLatLng, {
        radius: 9,
        color: "#ff0000",
        fillColor: "#ff0000",
        fillOpacity: 1,
        opacity: 1,
        weight: 3
    });
}
    }

    // NCS
    if (feature.properties.type === "NCS") {
        return L.circleMarker(latlng, {
            radius: 10,
            color: "#008000",
            fillColor: "#008000",
            fillOpacity: 0.8,
            weight: 2
        });
    }

    // Mobile check-in points
    if (feature.properties.type === "Mobile Check-In") {
        return L.circleMarker(latlng, {
            radius: 6,
            color: "black",
            fillColor: "yellow",
            fillOpacity: 0.8,
            weight: 2
        });
    }

    // Fallback
    return L.circleMarker(latlng, {
        radius: 6,
        color: "gray",
        fillColor: "lightgray",
        fillOpacity: 0.8,
        weight: 2
    });
},

      onEachFeature: function(feature, layer) {

        let popup = "";

        if (feature.properties.name) {
          popup += "<b>" + feature.properties.name + "</b><br>";
        }

        if (feature.properties.type) {
          popup += "Type: " + feature.properties.type + "<br>";
        }

        if (feature.properties.freq) {
          popup += "Freq: " + feature.properties.freq + "<br>";
        }

        if (feature.properties.quality) {
          popup += "Quality: " + feature.properties.quality + "<br>";
        }

if (feature.properties.mobile_unit) {
  popup += "Mobile: " + feature.properties.mobile_unit + "<br>";
}

if (feature.properties.stop) {
  popup += "Stop: " + feature.properties.stop + "<br>";
}

if (feature.properties.location) {
  popup += "Location: " + feature.properties.location + "<br>";
}

if (feature.properties.band) {
  popup += "Band: " + feature.properties.band + "<br>";
}

if (feature.properties.site) {
  popup += "Site: " + feature.properties.site + "<br>";
}

        layer.bindPopup(popup);

      },

      style: function(feature) {

        if (feature.geometry.type === "LineString") {

          return {
            weight: 4
          };

        }

      }

    }).addTo(map);

  });
  </script>
</body>
</html>
