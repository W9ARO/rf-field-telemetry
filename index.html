<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RF Field Telemetry Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }

  .uhf-star {
      position: relative;
      width: 28px;
      height: 28px;
    }

  .uhf-star-square {
    position: absolute;
      left: 5px;
      top: 5px;
      width: 18px;
      height: 18px;
      background: #ff0000;
      border: 2px solid #ff0000;
      box-sizing: border-box;
    }

    .uhf-star-square.rotated {
      transform: rotate(45deg);
      transform-origin: center center;
    }

    .legend {
  background: rgba(255, 255, 255, 0.88);
  padding: 10px 12px;
  border: 1px solid #888;
  border-radius: 6px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  line-height: 1.35;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
}

.legend-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 3px 0;
}

.legend-note {
  margin-top: 7px;
  font-size: 11px;
  color: #444;
}
  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    const map = L.map("map").setView([30.438, -84.280], 10);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "&copy; Esri"
      }
    ).addTo(map);

    const ncsLayer = L.layerGroup().addTo(map);
    const mobileLayer = L.layerGroup().addTo(map);
    const repeaterLayers = {};
    const activeRepeaters = new Set();

    function getOrCreateRepeaterLayer(repeaterName) {
      if (!repeaterLayers[repeaterName]) {
        repeaterLayers[repeaterName] = L.layerGroup().addTo(map);
        activeRepeaters.add(repeaterName);
      }

      return repeaterLayers[repeaterName];
    }

    function adjustedRepeaterLatLng(feature, latlng) {
      if (feature.properties.band === "VHF") {
        return L.latLng(
          latlng.lat + 0.0025,
          latlng.lng - 0.0025
        );
      }

      if (feature.properties.band === "UHF") {
        return L.latLng(
          latlng.lat - 0.0025,
          latlng.lng + 0.0025
        );
      }

      return latlng;
    }

    function makeRepeaterMarker(feature, latlng) {
      const adjustedLatLng = adjustedRepeaterLatLng(feature, latlng);

      if (feature.properties.band === "VHF") {
        return L.circleMarker(adjustedLatLng, {
          radius: 9,
          color: "#0000ff",
          fillColor: "#0000ff",
          fillOpacity: 1,
          opacity: 1,
          weight: 3
        });
      }

      if (feature.properties.band === "UHF") {
        return L.marker(adjustedLatLng, {
          icon: L.divIcon({
            className: "",
            html: `
              <div class="uhf-star">
                <div class="uhf-star-square"></div>
                <div class="uhf-star-square rotated"></div>
              </div>
            `,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          })
        });
      }

      return L.circleMarker(adjustedLatLng, {
        radius: 8,
        color: "gray",
        fillColor: "lightgray",
        fillOpacity: 1,
        opacity: 1,
        weight: 2
      });
    }

    function makeNcsMarker(latlng) {
      return L.circleMarker(latlng, {
        radius: 10,
        color: "#008000",
        fillColor: "#008000",
        fillOpacity: 0.9,
        opacity: 1,
        weight: 2
      });
    }

    function makeMobileMarker(latlng) {
      return L.circleMarker(latlng, {
        radius: 13,
        color: "black",
        fillColor: "Cornsilk",
        fillOpacity: 1,
        opacity: 1,
        weight: 3
      });
    }

function makeNcsRepeaterLink(feature) {

  const repeaterColors = {
    "AE4S 146.655": "Blue",
    "K4TLH 146.910": "Green",
    "K4TLH 147.030": "Orange",
    "AE4S 443.950": "Purple",
    "K4TLH 444.800": "Red"
  };

  const repeater = feature.properties.repeater;

  return L.geoJSON(feature, {

    style: function() {
      return {
        color: repeaterColors[repeater] || "Gray",
        weight: 2,
        opacity: 0.55,
        dashArray: "12 4 2 4",
        interactive: false
      };
    },

    interactive: false

  });
}
    
function makeSignalConnector(feature) {

const repeaterColors = {
  "AE4S 146.655": "Blue",
  "K4TLH 146.910": "Green",
  "K4TLH 147.030": "Orange",
  "AE4S 443.950": "Purple",
  "K4TLH 444.800": "Red"
};

  const repeater = feature.properties.repeater;
  const average = Number(feature.properties.average || 1);

  return L.geoJSON(feature, {
    style: function() {
      return {
        color: repeaterColors[repeater] || "#666666",
        weight: Math.max(1, average),
        opacity: 0.70,
        dashArray:
          feature.properties.band === "VHF"
            ? "8 6"
            : "2 8",
        interactive: false
      };
    },
    interactive: false
  });
}

    function buildPopup(feature) {
      let popup = "";
      const props = feature.properties || {};

      if (props.name) {
        popup += "<b>" + props.name + "</b><br>";
      }

      if (props.type) {
        popup += "Type: " + props.type + "<br>";
      }

      if (props.mobile_unit) {
        popup += "Mobile: " + props.mobile_unit + "<br>";
      }

      if (props.stop) {
        popup += "Stop: " + props.stop + "<br>";
      }

      if (props.location) {
        popup += "Location: " + props.location + "<br>";
      }

      if (props.band) {
        popup += "Band: " + props.band + "<br>";
      }

      if (props.site) {
        popup += "Site: " + props.site + "<br>";
      }

      if (props.scores) {
        const visibleScores = props.scores.filter(function(score) {
          return activeRepeaters.has(score.repeater);
        });

        if (visibleScores.length > 0) {
          popup += "<br><b>Average Signal Quality</b><br>";

          visibleScores.forEach(function(score) {
            popup += score.repeater
              + ": " + score.average
              + "<br>";
          });
        }
      }

      return popup;
    }

    function addFeature(feature) {
      const props = feature.properties || {};
      const geometry = feature.geometry || {};

      if (props.type === "Repeater" && geometry.type === "Point") {
        const latlng = L.latLng(
          geometry.coordinates[1],
          geometry.coordinates[0]
        );

        const marker = makeRepeaterMarker(feature, latlng);
        marker.bindPopup(function() {
          return buildPopup(feature);
        });

        getOrCreateRepeaterLayer(props.name).addLayer(marker);
        return;
      }

      if (props.type === "NCS Repeater Link" && geometry.type === "LineString") {
      const link = makeNcsRepeaterLink(feature);
      getOrCreateRepeaterLayer(props.repeater).addLayer(link);
      return;
      }      

      if (props.type === "Signal Connector" && geometry.type === "LineString") {
        const connector = makeSignalConnector(feature);
        getOrCreateRepeaterLayer(props.repeater).addLayer(connector);
        return;
      }

      if (props.type === "NCS" && geometry.type === "Point") {
        const latlng = L.latLng(
          geometry.coordinates[1],
          geometry.coordinates[0]
        );

        const marker = makeNcsMarker(latlng);
        marker.bindPopup(function() {
          return buildPopup(feature);
        });

        ncsLayer.addLayer(marker);
        return;
      }

      if (props.type === "Mobile Check-In" && geometry.type === "Point") {
        const latlng = L.latLng(
          geometry.coordinates[1],
          geometry.coordinates[0]
        );

        const marker = makeMobileMarker(latlng);
        marker.bindPopup(function() {
          return buildPopup(feature);
        });

        mobileLayer.addLayer(marker);
        return;
      }
    }

    fetch("data.geojson")
      .then(response => response.json())
      .then(data => {
        data.features.forEach(addFeature);

        L.control.layers(
          null,
          repeaterLayers,
          {
            collapsed: false
          }
        ).addTo(map);

        map.on("overlayadd", function(event) {
          activeRepeaters.add(event.name);
        });

        map.on("overlayremove", function(event) {
          activeRepeaters.delete(event.name);
        });
      });

      const legend = L.control({ position: "bottomright" });

legend.onAdd = function() {
  const div = L.DomUtil.create("div", "legend");

  div.innerHTML = `
    <div class="legend-title">RF Field Telemetry</div>

    <div class="legend-row">● <span>VHF repeater</span></div>
    <div class="legend-row">✸ <span>UHF repeater</span></div>
    <div class="legend-row">● <span>NCS</span></div>
    <div class="legend-row">● <span>Mobile check-in</span></div>

    <hr>

    <div class="legend-row">━ <span>NCS ↔ repeater link</span></div>
    <div class="legend-row">┄ <span>Repeater ↔ mobile signal path</span></div>
    <div class="legend-row"><span>Line thickness = average signal quality</span></div>

    <div class="legend-note">Repeater locations approximate pending verification.</div>
  `;

  return div;
};

legend.addTo(map);

  </script>
</body>
</html>
